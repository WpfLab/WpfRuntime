name: Build WPF NuGet Package

on:
  push:
    branches: [ main, WpfReorganize ]
  pull_request:
    branches: [ main, WpfReorganize ]
  workflow_dispatch:

jobs:
  build-solution:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build solution
      run: msbuild Microsoft.Dotnet.Wpf.slnx -restore /p:Configuration=Debug /p:Platform=x64 /m:1 /v:minimal

  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore Builder project (resolves NuGet package paths)
      run: dotnet restore eng/Builder/Builder.csproj

    - name: Build Builder project
      run: dotnet build eng/Builder/Builder.csproj --no-restore

    - name: Run full build + packaging
      run: >
        dotnet run --project eng/Builder/Builder.csproj --no-build --
        --version 1.0.0-${{ github.sha }}

    - name: Test generated NuGet package
      run: dotnet run --project eng/Builder/Builder.csproj --no-build -- test-package

    - name: Upload package test diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: DotNetCampus.WpfLib-package-tests
        path: eng/Builder/bin/package-tests
        if-no-files-found: warn

    - name: Generate artifact suffix
      id: artifact-metadata
      shell: pwsh
      run: |
        $timestamp = Get-Date -AsUTC -Format 'yyyyMMddHHmmss'
        $gitCommit = $env:GITHUB_SHA.Substring(0, 7)
        "suffix=$timestamp-$gitCommit" >> $env:GITHUB_OUTPUT

    - name: Upload NuGet package artifact
      uses: actions/upload-artifact@v4
      with:
        name: DotNetCampus.WpfLib-nupkg-${{ steps.artifact-metadata.outputs.suffix }}
        path: eng/Builder/bin/nupkg/*.nupkg
        if-no-files-found: warn
