name: Build WPF NuGet Package

on:
  push:
    branches: [ main, WpfReorganize ]
    tags: [ '*' ]
  pull_request_target:
    branches: [ main, WpfReorganize ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-wpf-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-solution:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
    - name: Checkout trusted Builder
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        path: trusted
        fetch-depth: 1
        persist-credentials: false

    - name: Checkout tested commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
        path: tested
        fetch-depth: 0
        persist-credentials: false

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Restore trusted Builder
      working-directory: trusted
      run: dotnet restore eng/Builder/Builder.csproj -p:RestoreWpfRuntimePackages=false

    - name: Build trusted Builder
      working-directory: trusted
      run: dotnet build eng/Builder/Builder.csproj --no-restore -p:RestoreWpfRuntimePackages=false

    - name: Restore and rebuild solution through trusted Builder
      working-directory: trusted
      run: dotnet eng/Builder/bin/Builder.dll ci-build --repository ../tested --target solution

  build-package:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.build-package.outputs.artifact-name }}
      version: ${{ steps.build-package.outputs.version }}

    steps:
    - name: Checkout trusted Builder
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        path: trusted
        fetch-depth: 1
        persist-credentials: false

    - name: Checkout tested commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
        path: tested
        fetch-depth: 0
        persist-credentials: false

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Restore trusted Builder
      working-directory: trusted
      run: dotnet restore eng/Builder/Builder.csproj -p:RestoreWpfRuntimePackages=false

    - name: Build trusted Builder
      working-directory: trusted
      run: dotnet build eng/Builder/Builder.csproj --no-restore -p:RestoreWpfRuntimePackages=false

    - name: Build and test package through trusted Builder
      id: build-package
      working-directory: trusted
      run: dotnet eng/Builder/bin/Builder.dll ci-build --repository ../tested --target package

    - name: Upload package test diagnostics
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: WpfLab.WpfRuntime-package-tests-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: tested/eng/Builder/bin/package-tests
        if-no-files-found: warn
        retention-days: 7

    - name: Upload NuGet package artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build-package.outputs.artifact-name }}
        path: tested/eng/Builder/bin/nupkg/*.nupkg
        if-no-files-found: error
        retention-days: 7

    - name: Upload NuGet symbol package artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build-package.outputs.artifact-name }}-symbols
        path: tested/eng/Builder/bin/nupkg/*.snupkg
        if-no-files-found: error
        retention-days: 7

  publish-package:
    needs: [build-solution, build-package]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
    - name: Download NuGet package artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ needs.build-package.outputs.artifact-name }}
        path: nupkg

    - name: Download NuGet symbol package artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ needs.build-package.outputs.artifact-name }}-symbols
        path: nupkg

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Push generated package to NuGet registries
      shell: pwsh
      run: |
        $packagePath = "nupkg/WpfLab.WpfRuntime.${{ needs.build-package.outputs.version }}.nupkg"
        if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
          throw "Expected NuGet package was not found: $packagePath"
        }
        dotnet nuget push $packagePath -s https://api.nuget.org/v3/index.json -k "${{ secrets.NugetKey }}"
        dotnet nuget push $packagePath -s "https://nuget.pkg.github.com/${{ github.repository_owner }}" --api-key "${{ secrets.GITHUB_TOKEN }}"
