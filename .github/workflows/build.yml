name: Build WPF NuGet Package

on:
  push:
    branches: [ main, WpfReorganize ]
  pull_request_target:
    branches: [ main, WpfReorganize ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-wpf-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-solution:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
    - name: Checkout tested commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Verify checkout has no persisted credentials
      shell: pwsh
      run: |
        $extraHeaders = git config --local --get-regexp '^http\..*\.extraheader$' 2>$null
        if ($LASTEXITCODE -eq 0 -or $extraHeaders) {
          throw "Checkout persisted an HTTP authentication header in .git/config."
        }
        $remoteUrls = git remote -v
        if ($remoteUrls -match 'x-access-token|oauth2:|https://[^/]+@github\.com') {
          throw "Checkout persisted credentials in a Git remote URL."
        }

    - name: Record tested identities
      shell: pwsh
      run: |
        $testedSha = (git rev-parse HEAD).Trim()
        "Tested merge/commit SHA: $testedSha"
        if ('${{ github.event_name }}' -eq 'pull_request_target') {
          "Source PR head SHA: ${{ github.event.pull_request.head.sha }}"
          "Trusted workflow/base SHA: ${{ github.sha }}"
        }

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

    - name: Restore and rebuild solution
      shell: pwsh
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
        ACTIONS_RUNTIME_TOKEN: ""
        ACTIONS_RUNTIME_URL: ""
        ACTIONS_RESULTS_URL: ""
        GITHUB_ENV: ""
        GITHUB_PATH: ""
        GITHUB_OUTPUT: ""
        GITHUB_STATE: ""
        GITHUB_STEP_SUMMARY: ""
      run: msbuild Microsoft.Dotnet.Wpf.slnx -restore /t:Rebuild /p:Configuration=Debug /p:Platform=x64 /m:1 /nr:false /v:minimal

  build-package:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
    - name: Checkout tested commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Verify checkout has no persisted credentials
      shell: pwsh
      run: |
        $extraHeaders = git config --local --get-regexp '^http\..*\.extraheader$' 2>$null
        if ($LASTEXITCODE -eq 0 -or $extraHeaders) {
          throw "Checkout persisted an HTTP authentication header in .git/config."
        }
        $remoteUrls = git remote -v
        if ($remoteUrls -match 'x-access-token|oauth2:|https://[^/]+@github\.com') {
          throw "Checkout persisted credentials in a Git remote URL."
        }

    - name: Compute tested identities and package path
      id: build-identity
      shell: pwsh
      run: |
        $testedSha = (git rev-parse HEAD).Trim()
        $testedPrefix = $testedSha.Substring(0, 12)
        if ('${{ github.event_name }}' -eq 'pull_request_target') {
          $prNumber = '${{ github.event.pull_request.number }}'
          $sourceHeadSha = '${{ github.event.pull_request.head.sha }}'
          $version = "0.0.0-pr.$prNumber.sha$testedPrefix"
          $artifactIdentity = "pr-$prNumber"
          "Source PR head SHA: $sourceHeadSha"
          "Trusted workflow/base SHA: ${{ github.sha }}"
        }
        else {
          $version = "0.0.0-ci.sha$testedPrefix"
          $artifactIdentity = "event-${{ github.event_name }}"
        }
        $packagePath = Join-Path $PWD "eng/Builder/bin/nupkg/DotNetCampus.WpfLib.$version.nupkg"
        "Tested merge/commit SHA: $testedSha"
        "Package version: $version"
        "tested-sha=$testedSha" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT
        "package-path=$packagePath" >> $env:GITHUB_OUTPUT
        "artifact-name=DotNetCampus.WpfLib-nupkg-$artifactIdentity-sha-$testedSha-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

    - name: Restore Builder project (resolves NuGet package paths)
      shell: pwsh
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
        ACTIONS_RUNTIME_TOKEN: ""
        ACTIONS_RUNTIME_URL: ""
        ACTIONS_RESULTS_URL: ""
        GITHUB_ENV: ""
        GITHUB_PATH: ""
        GITHUB_OUTPUT: ""
        GITHUB_STATE: ""
        GITHUB_STEP_SUMMARY: ""
      run: dotnet restore eng/Builder/Builder.csproj

    - name: Build Builder project
      shell: pwsh
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
        ACTIONS_RUNTIME_TOKEN: ""
        ACTIONS_RUNTIME_URL: ""
        ACTIONS_RESULTS_URL: ""
        GITHUB_ENV: ""
        GITHUB_PATH: ""
        GITHUB_OUTPUT: ""
        GITHUB_STATE: ""
        GITHUB_STEP_SUMMARY: ""
      run: dotnet build eng/Builder/Builder.csproj --no-restore

    - name: Run full build + packaging
      shell: pwsh
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
        ACTIONS_RUNTIME_TOKEN: ""
        ACTIONS_RUNTIME_URL: ""
        ACTIONS_RESULTS_URL: ""
        GITHUB_ENV: ""
        GITHUB_PATH: ""
        GITHUB_OUTPUT: ""
        GITHUB_STATE: ""
        GITHUB_STEP_SUMMARY: ""
      run: |
        Remove-Item eng/Builder/bin/nupkg -Recurse -Force -ErrorAction SilentlyContinue
        dotnet run --project eng/Builder/Builder.csproj --no-build -- --version '${{ steps.build-identity.outputs.version }}'
        $packagePath = '${{ steps.build-identity.outputs.package-path }}'
        if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf) -or (Get-Item -LiteralPath $packagePath).Length -eq 0) {
          throw "Expected non-empty NuGet package was not produced: $packagePath"
        }

    - name: Test generated NuGet package
      shell: pwsh
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
        ACTIONS_RUNTIME_TOKEN: ""
        ACTIONS_RUNTIME_URL: ""
        ACTIONS_RESULTS_URL: ""
        GITHUB_ENV: ""
        GITHUB_PATH: ""
        GITHUB_OUTPUT: ""
        GITHUB_STATE: ""
        GITHUB_STEP_SUMMARY: ""
      run: dotnet run --project eng/Builder/Builder.csproj --no-build -- test-package --package '${{ steps.build-identity.outputs.package-path }}'

    - name: Upload package test diagnostics
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: DotNetCampus.WpfLib-package-tests-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: eng/Builder/bin/package-tests
        if-no-files-found: warn
        retention-days: 7

    - name: Upload NuGet package artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.build-identity.outputs.artifact-name }}
        path: ${{ steps.build-identity.outputs.package-path }}
        if-no-files-found: error
        retention-days: 7
